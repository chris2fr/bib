{% load static %}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="stylesheet" href="{% static 'pieces/style.css' %}">
</head>
<body>
<header>
  <a class="brand" href="{% url 'list' %}">{{ site_name }}</a>
  <nav>
    {% if not readonly %}<a href="{% url 'create' %}">Nouvelle entrée</a>{% endif %}
    <a href="{% url 'help' %}">Aide</a>
    <a href="{% url 'audit' %}">Audit</a>
    <a href="{% url 'duplicates' %}">Doublons</a>
    <a href="{% url 'export_json' %}">fr.json</a>
    <a href="{% url 'export_bib' %}">fr.bib</a>
  </nav>
</header>
<main>
{% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
